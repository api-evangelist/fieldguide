aid: fieldguide
name: Fieldguide
description: >-
  Fieldguide is an AI-native platform for audit and advisory firms, providing
  professional-grade "Field Agents" that plan, execute, and document engagement
  work end-to-end across financial audit, SOC audits, IT audit, risk advisory,
  tax, cybersecurity, and regulatory compliance engagements. The platform pairs
  engagement management, document management, insights and analytics, and a
  client hub with an open REST API (api.fieldguide.io) that exposes companies,
  engagements, requests, sheets, files, comments, milestones, users, insights,
  and webhook subscriptions. Fieldguide is used by half of the top 100 firms,
  is SOC 2 Type 2 and ISO/IEC 42001 certified, and is backed by 8VC and
  Bessemer Venture Partners.
